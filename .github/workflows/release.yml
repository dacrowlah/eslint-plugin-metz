name: Release

# Publishes a `v*` tag to npm through trusted publishing (OIDC): no npm token is stored anywhere,
# and npm adds provenance. npm's trusted publisher for this package names this file
# (`release.yml`) and the `npm` environment, so renaming either breaks publishing. The process is
# in .claude/skills/release-plugin/SKILL.md.
#
# Two jobs, so the OIDC token is never in reach of the dependencies `pnpm check` runs: `pack`
# verifies and packs with read-only permissions; `publish` only uploads that tarball.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The one name of the tarball both jobs hand to npm. It starts with `./`: npm reads a bare
  # `release/x.tgz` as the GitHub repository `release/x.tgz`, not as a file.
  TARBALL: ./release/eslint-plugin-metz.tgz

# Actions are pinned to the commit of a release tag (the comment names it), so a moved tag cannot
# change what runs.
jobs:
  pack:
    name: check and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history, to check that the tag is on main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; reads packageManager
      # No cache: a release builds from a clean store.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The tag's type comes from GitHub, not the checkout: checkout may store a fetched tag as a
      # lightweight one.
      - name: The tag is annotated, names the package version, and is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # npm's pack of the build `pnpm check` just checked (the smoke test installs the same pack).
      - run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          mv release/eslint-plugin-metz-*.tgz "$TARBALL"
          sha256sum "$TARBALL"
      # The publish job's command on this tarball, as a dry run: it needs no npm login, and fails
      # when npm cannot read the tarball's path as a file. It checks the path only: `--force` lets
      # the dry run pass for a version npm already has (a re-run, or one published by hand), and
      # npm's version rules stay with the real publish, which `--dry-run` keeps from happening here.
      - name: npm can read the tarball path
        run: npm publish "$TARBALL" --dry-run --force --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: pack
    runs-on: ubuntu-latest
    # A GitHub environment, so the owner can limit it to `v*` tags and add required reviewers.
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a one-time publish token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `registry-url`: npm's default registry is the public one, and the .npmrc it writes would
      # hand npm a placeholder NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: npm is 11.5.1 or later, as trusted publishing needs
        run: |
          v="$(npm -v)"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exitCode = a * 1e6 + b * 1e3 + c >= 11005001 ? 0 : 1;' "$v" ||
            { echo "::error::npm $v is older than 11.5.1"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: release
      # A version npm already has (a re-run, or 0.1.1, published by hand) is a notice, not a failure.
      # Fails safe: `npm view` prints nothing for an unknown version, package or a network error, so
      # those still try to publish and fail loudly.
      - name: Skip a version npm already has
        id: npm
        run: |
          if [ -n "$(npm view "eslint-plugin-metz@${GITHUB_REF_NAME#v}" version 2>/dev/null)" ]; then
            echo "::notice::eslint-plugin-metz@${GITHUB_REF_NAME#v} is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # A tarball publish runs no package scripts. `--provenance` makes a missing provenance
      # statement fail the publish instead of passing silently.
      - if: steps.npm.outputs.published != 'true'
        run: npm publish "$TARBALL" --provenance
