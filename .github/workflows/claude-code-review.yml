# Claude reviews each pull request from a branch of this repository and posts inline comments.
# `pull_request` (never `pull_request_target`): fork PRs get no secrets, so they are not reviewed.
name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

# A new push supersedes the review of the old head, so a late review can never vouch for a newer one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1.0.258
        # Subagents run in the foreground: the action stops reading at the first result, so work
        # left in the background (and any scheduled wake-up) dies with the job.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          CLAUDE_CODE_DISABLE_CRON: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The code-review plugin's own allowed-tools (plugins/code-review/commands/code-review.md), granted
          # to its subagents too; no `gh api` (it can write). Opus runs the plugin's subagents to completion.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
