name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to the commit of a release tag (the comment names it), so a moved tag cannot
# change what runs.
jobs:
  check:
    name: pnpm check (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installing builds dist/ through the `prepare` script.
      - run: pnpm install --frozen-lockfile
      # `pnpm check` is the single source of truth for the quality gates. The git-install smoke
      # test commits and tags only in a throwaway repository, unsigned, under its own identity.
      - run: pnpm check

  smoke:
    name: install and smoke on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24', '26'] # the lowest supported (engines), the LTS, and Current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # `prepare` builds on this Node: the build scripts are plain JavaScript for that reason.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke
